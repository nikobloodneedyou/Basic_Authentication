<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Basic Auth App</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-logo">🔐</div>
        <h2>Welcome Back</h2>
        <p class="auth-subtitle">Sign in to your account</p>

        <div id="errorMsg" class="alert alert-error hidden"></div>

        <form id="loginForm" novalidate>
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="toggle-password" onclick="togglePassword('password', this)" aria-label="Toggle password">👁</button>
                </div>
            </div>
            <button type="submit" class="btn" id="submitBtn">
                <span class="btn-text">Sign In</span>
                <span class="btn-spinner hidden">⏳</span>
            </button>
        </form>

        <p class="switch-text">Don't have an account? <a href="/register">Create one</a></p>
    </div>
    <script src="/static/script.js"></script>
</body>

</html>
